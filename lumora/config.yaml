name: Lumora
version: "8.2.2"
slug: lumora
description: Smart-home hub for your lights, with accounts for the whole household
url: https://github.com/seymour6000-beep/lumora-addon
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Lumora web page
options:
  allow_signup: false
  admin_reset: false
schema:
  allow_signup: bool
  admin_reset: bool
