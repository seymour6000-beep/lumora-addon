plugins {
    id 'com.android.application'
}
android {
    namespace 'ca.lumora.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'ca.lumora.tv'
        minSdk 21
        targetSdk 34
        versionCode 230
        versionName '2.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable false }
    }
}
