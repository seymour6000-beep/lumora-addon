name: Build Android TV app
on:
  push:
    paths: ['tv-android/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: tv-android
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp tv-android/app/build/outputs/apk/debug/app-debug.apk Lumora-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lumora-TV, path: Lumora-TV.apk }
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest Lumora-TV.apk --title "Lumora for Google TV" --notes "Install this APK on Google TV / Android TV (Downloader app or adb)."
